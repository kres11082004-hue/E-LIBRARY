services:
  # ─────────────────────────────────────────────
  # Backend: Express API (Web Service)
  # ─────────────────────────────────────────────
  - type: web
    name: e-library-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build"
    startCommand: "node --enable-source-maps artifacts/api-server/dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false   # ← Set this manually in Render Dashboard
      - key: SESSION_SECRET
        sync: false   # ← Set this manually in Render Dashboard

  # ─────────────────────────────────────────────
  # Frontend: React/Vite (Static Site)
  # ─────────────────────────────────────────────
  - type: web
    name: e-library-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm --filter @workspace/elibrary run build"
    staticPublishPath: artifacts/elibrary/dist/public
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # ← Set to your backend Render URL, e.g. https://e-library-api.onrender.com
    routes:
      - type: rewrite
        source: /api/*
        destination: https://e-library-api.onrender.com/api/$1
      - type: rewrite
        source: /*
        destination: /index.html
